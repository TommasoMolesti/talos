name: Test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build local binary
        run: go build -trimpath -o talos .

      - name: Validate bundled examples
        run: |
          for file in examples/*.yaml; do
            ./talos validate --file "$file"
            ./talos run --file "$file" --dry-run
          done
          ./talos visualize --file examples/monorepo.yaml
